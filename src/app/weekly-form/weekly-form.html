<div class="welcome-page">
  <section class="welcome-page-header">
    <div class="welcome-page__card content-card">
      <p class="welcome-page__step">
        @let progress = stepProgress(); @let step = currentStep(); @if (step !==
        WeeklyFormStep.Submitted) { {{ 'common.stepProgress' | translate: { current:
        progress.current, total: progress.total } }} } @else { {{ 'weekly.submittedStepLabel' |
        translate }} }
      </p>
      <h1>{{ 'weekly.title' | translate }}</h1>
    </div>
  </section>
  <section class="welcome-page__content">
    <router-outlet></router-outlet>
  </section>
</div>
